<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduDash</title>
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EduDash">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=20260514006">
  <script>
    window.MathJax = { tex: { inlineMath: [["\\(", "\\)"], ["$", "$"]] }, svg: { fontCache: "global" } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <script defer src="data.js?v=20260514006"></script>
  <script defer src="app.js?v=20260514006"></script>
  <script defer src="bank_override.js?v=20260514006"></script>
  <script defer src="dashboard_override.js?v=20260514006"></script>
</head>
<body>
  <main id="auth-screen" class="auth-shell">
    <section class="auth-panel">
      <div>
        <p class="eyebrow">Middle School Learning</p>
        <h1>EduDash</h1>
        <p class="muted">국어와 수학 학습, 오답 복습, 학습 현황을 한 곳에서 관리합니다.</p>
      </div>
      <form id="auth-form" class="auth-form">
        <label>사용자 이름
          <input id="username" required maxlength="20" autocomplete="username" placeholder="예: 민준">
        </label>
        <label>비밀번호
          <input id="password" required type="password" minlength="4" autocomplete="current-password" placeholder="4자 이상">
        </label>
        <div class="auth-actions">
          <button class="primary" type="submit" data-mode="login">로그인</button>
          <button class="secondary" type="button" id="signup-btn">회원가입</button>
        </div>
        <p id="auth-message" class="message"></p>
      </form>
    </section>
  </main>

  <main id="app-shell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <button id="brand-home-btn" class="brand-main" type="button" aria-label="EduDash 소개 화면">
          <span class="logo">E</span>
          <span>
            <strong>EduDash</strong>
            <small id="active-user"></small>
          </span>
        </button>
        <button id="mobile-menu-btn" class="secondary mobile-menu-btn" type="button">메뉴</button>
      </div>
      <nav>
        <button class="nav" data-view="quiz">퀴즈</button>
        <button class="nav" data-view="wrong">오답노트</button>
        <button class="nav" data-view="bank">문제은행</button>
        <button class="nav" data-view="stats">학습현황</button>
      </nav>
      <button id="logout-btn" class="ghost">로그아웃</button>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow top-context"><span>오늘의 학습</span><span id="top-chapter-label"></span></p>
          <h2 id="view-title">대시보드</h2>
        </div>
        <div class="top-actions">
          <button id="top-logout-btn" class="secondary">로그아웃</button>
          <button id="reset-user-btn" class="danger">내 학습 초기화</button>
        </div>
      </header>

      <section id="home-view" class="view home-view">
        <img src="assets/edudash-intro.svg" alt="EduDash 프로그램 소개">
      </section>

      <section id="quiz-view" class="view hidden">
        <div id="quiz-setup" class="panel">
          <h3>퀴즈 설정</h3>
          <div class="form-grid quiz-grid">
            <label>학년<select id="grade-select"></select></label>
            <label>과목<select id="subject-select"></select></label>
            <label>챕터<select id="chapter-select"></select></label>
            <label>난이도
              <select id="difficulty-select">
                <option value="all" selected>전체</option>
                <option value="easy">하</option>
                <option value="normal">중</option>
                <option value="hard">상</option>
              </select>
            </label>
            <label>문제 수<input id="count-input" type="number" min="1" max="20" value="5"></label>
          </div>
          <p id="quiz-message" class="message"></p>
          <div class="inline-actions">
            <button id="start-quiz-btn" class="primary">퀴즈 시작</button>
            <button id="wrong-type-quiz-btn" class="secondary">오답 유형만 풀기</button>
            <button id="add-subject-btn" class="secondary">과목 추가</button>
          </div>
        </div>
        <div id="quiz-runner" class="panel hidden"></div>
      </section>

      <section id="wrong-view" class="view hidden"></section>
      <section id="bank-view" class="view hidden"></section>
      <section id="stats-view" class="view hidden"></section>
    </section>
  </main>
</body>
</html>
