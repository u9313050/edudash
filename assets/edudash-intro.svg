<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">EduDash 소개</title>
  <desc id="desc">중학생 국어, 수학, 과학 학습을 퀴즈, 문제은행, 오답노트, 학습현황으로 관리하는 EduDash 소개 이미지</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset=".52" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf7f2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1e40af" flood-opacity=".13"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif; fill: #10203a; }
      .blue { fill: #2563eb; }
      .muted { fill: #5f6f8a; }
      .panel { fill: #ffffff; stroke: #dbe7f6; stroke-width: 2; filter: url(#softShadow); }
      .soft { fill: #eaf2ff; }
      .green { fill: #16a34a; }
      .red { fill: #dc2626; }
      .label { font-size: 28px; font-weight: 800; }
      .body { font-size: 22px; font-weight: 600; }
      .small { font-size: 18px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1410" cy="150" r="96" fill="#d9f99d" opacity=".45"/>
  <circle cx="160" cy="720" r="120" fill="#bfdbfe" opacity=".45"/>
  <circle cx="1320" cy="760" r="150" fill="#c7f9e5" opacity=".42"/>

  <g transform="translate(120 96)">
    <rect x="0" y="0" width="144" height="144" rx="34" fill="#2563eb"/>
    <text x="72" y="92" text-anchor="middle" font-size="58" font-weight="900" fill="#fff">E</text>
    <text x="176" y="58" font-size="54" font-weight="900">EduDash</text>
    <text x="178" y="98" class="muted" font-size="24" font-weight="700">중학생을 위한 문제은행 기반 학습 관리</text>
  </g>

  <text x="120" y="304" font-size="64" font-weight="900">풀고, 틀리고, 다시 잡는 학습 흐름</text>
  <text x="122" y="352" class="muted" font-size="26" font-weight="700">국어 · 수학 · 과학을 챕터별 문제은행, 오답 유형, 학습현황으로 한 번에 정리합니다.</text>

  <g transform="translate(120 430)">
    <rect class="panel" x="0" y="0" width="320" height="210" rx="22"/>
    <rect class="soft" x="34" y="32" width="72" height="72" rx="18"/>
    <path d="M54 70h32M70 54v32" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>
    <text x="34" y="134" class="label">문제은행</text>
    <text x="34" y="170" class="body muted">챕터별 100개 유형 저장</text>
  </g>

  <g transform="translate(470 430)">
    <rect class="panel" x="0" y="0" width="320" height="210" rx="22"/>
    <rect class="soft" x="34" y="32" width="72" height="72" rx="18"/>
    <path d="M51 69l15 16 32-38" fill="none" stroke="#16a34a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="134" class="label">퀴즈</text>
    <text x="34" y="170" class="body muted">중복 없이 필요한 만큼 출제</text>
  </g>

  <g transform="translate(820 430)">
    <rect class="panel" x="0" y="0" width="320" height="210" rx="22"/>
    <rect class="soft" x="34" y="32" width="72" height="72" rx="18"/>
    <path d="M54 54l34 34M88 54L54 88" stroke="#dc2626" stroke-width="9" stroke-linecap="round"/>
    <text x="34" y="134" class="label">오답 유형</text>
    <text x="34" y="170" class="body muted">틀린 유형만 다시 연습</text>
  </g>

  <g transform="translate(1170 430)">
    <rect class="panel" x="0" y="0" width="320" height="210" rx="22"/>
    <rect class="soft" x="34" y="32" width="72" height="72" rx="18"/>
    <rect x="52" y="79" width="13" height="23" rx="4" fill="#2563eb"/>
    <rect x="73" y="62" width="13" height="40" rx="4" fill="#2563eb"/>
    <rect x="94" y="44" width="13" height="58" rx="4" fill="#2563eb"/>
    <text x="34" y="134" class="label">학습현황</text>
    <text x="34" y="170" class="body muted">일별 · 주간 · 월간 확인</text>
  </g>

  <g transform="translate(210 704)">
    <rect x="0" y="0" width="1180" height="86" rx="43" fill="#ffffff" stroke="#dbe7f6" stroke-width="2"/>
    <circle cx="58" cy="43" r="23" class="blue"/>
    <text x="58" y="52" text-anchor="middle" font-size="25" font-weight="900" fill="#fff">1</text>
    <text x="94" y="52" class="small">챕터 선택</text>
    <path d="M220 43h120" stroke="#bfd1ea" stroke-width="4" stroke-linecap="round"/>
    <circle cx="386" cy="43" r="23" class="blue"/>
    <text x="386" y="52" text-anchor="middle" font-size="25" font-weight="900" fill="#fff">2</text>
    <text x="422" y="52" class="small">문제 풀이</text>
    <path d="M548 43h120" stroke="#bfd1ea" stroke-width="4" stroke-linecap="round"/>
    <circle cx="714" cy="43" r="23" class="blue"/>
    <text x="714" y="52" text-anchor="middle" font-size="25" font-weight="900" fill="#fff">3</text>
    <text x="750" y="52" class="small">오답 유형 복습</text>
    <path d="M928 43h120" stroke="#bfd1ea" stroke-width="4" stroke-linecap="round"/>
    <circle cx="1094" cy="43" r="23" class="blue"/>
    <text x="1094" y="52" text-anchor="middle" font-size="25" font-weight="900" fill="#fff">4</text>
    <text x="1130" y="52" class="small">진행률 확인</text>
  </g>
</svg>
